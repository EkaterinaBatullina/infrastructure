stages:
  - .pre
  - build
  - publish-image
  - deploy

.build:
  stage: build
  image: openjdk:21-slim
  artifacts:
    expire_in: 1 days
    paths:
      - target/*.jar
  script:
    - apt-get update && apt-get install -y maven
    - mvn clean install -DskipTests --no-transfer-progress

build-develop:
  environment: develop
  extends: .build
  only:
    - develop

build-main:
  environment: main
  extends: .build
  only:
    - main

