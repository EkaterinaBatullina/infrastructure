build-kaniko-image:
  stage: .pre
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -f Dockerfile -t $CI_REGISTRY_IMAGE/kaniko-with-git .
    - docker push $CI_REGISTRY_IMAGE/kaniko-with-git
  before_script:
    - docker info

publish-image:
  stage: publish-image
  image:
    name: $CI_REGISTRY_IMAGE/kaniko-with-git
    entrypoint: [ '' ]
  before_script:
    - |
      echo "Проверка установленных пакетов..."
      ssh -V
      git --version
      echo "Проверка наличия libcrypto..."
      ldd $(which ssh) | grep libcrypto
      mkdir -p ~/.ssh
      echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_vm
      chmod 600 ~/.ssh/id_rsa_vm
      echo "Проверка загрузки ключа..."
      ssh-keygen -lf ~/.ssh/id_rsa_vm
      ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
      echo "Проверка SSH-подключения..."
      ssh -T -i ~/.ssh/id_rsa_vm git@gitlab.com
  script:
    - apk update && apk add git
    - GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa_vm' git clone git@gitlab.com:batullina-agona-2024.git
    - cd batullina-agona-2024/Agona-05
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "gitlab-ci-token" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --cache=true
      --context batullina-agona-2024/Agona-05
      --dockerfile batullina-agona-2024/Agona-05/Dockerfile 
      --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH
  only:
    - develop
    - main

.deploy:
  image: docker:19.03.8-dind
  stage: deploy
  dependencies:
    - build-develop
  script:
    - cp target/Agona-05-1.0-SNAPSHOT.jar ./app/
    - ./deploy.sh

deploy-develop:
  environment: develop
  extends: .deploy
  variables:
    BRANCH: develop
    SSH: develop
    TAG: develop
  only:
    - develop

deploy-main:
  environment: main
  extends: .deploy
  variables:
    BRANCH: main
    SSH: main
    TAG: main
  only:
    - main