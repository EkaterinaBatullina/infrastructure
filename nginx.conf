server {
    listen 80;
    server_name develop.example.com www.develop.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name develop.example.com www.develop.example.com;

    ssl_certificate /etc/letsencrypt/live/develop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/develop.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';

    root /var/www/develop.example.com;
    index index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

